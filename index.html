function cmpLearn(){

  $("cfb").innerHTML="<p><b>"+(ok?"✅ "+B("Correct!","सही!"):"❌ "+B("Not quite — look again","थोड़ा गलत — फिर देखो"))+"</b></p><p style='font-size:1.3rem'>"+big+" &gt; "+sm+"</p><p>"+B(big+" is BIGGER (more). "+sm+" is SMALLER (less).",big+" बड़ी है (ज़्यादा)। "+sm+" छोटी है (कम)।")+"</p>"+nl+"<p class='tipb'>💡 "+B("On the number line, bigger numbers are further to the RIGHT.","number line पर बड़ी संख्या और दाईं ओर होती है।")+"</p><button id='cnx'>▶ "+B("Next","आगे")+"</button>";

const POOL=["🍎","🐶","⭐","🚗","🌳","🎈","🐱","🌙","🍕","⚽","🎁","🦋"];
const SIM=[["🍎","🍅"],["🐶","🐺"],["🌙","🌛"],["⭐","🌟"],["🐱","🐯"],["🚗","🚕"],["🎈","🔴"],["🍕","🧀"],["⚽","🏀"],["🌳","🌲"],["🎁","📦"],["🦋","🐝"]];

function diffInit(lv){if(lv)dlv=lv;head("diff","🔎 "+B("Find the Difference","अंतर खोजो"));

{ic:"🕊️",te:"Unity is Strength",th:"एकता में शक्ति",en:"A hunter spread a net and some birds got trapped. The birds were scared, but they made a plan. All of them flapped their wings together and flew up with the net. They reached their friend, a mouse, who cut the net and set them free.",hi:"एक शिकारी ने जाल बिछाया और कुछ चिड़ियाँ उसमें फँस गईं। चिड़ियाँ डर गईं, पर उन्होंने मिलकर योजना बनाई। सबने एक साथ पंख फड़फड़ाए और जाल लेकर उड़ गईं। वे अपने दोस्त चूहे के पास पहुँचीं, जिसने जाल काटकर उन्हें आज़ाद कर दिया।",me:"Together we are strong.",mh:"एकता में शक्ति है।",q:[["What trapped the birds?|चिड़ियों को किसने फँसाया?","A net|एक जाल","A cage|पिंजरा","A box|डिब्बा","A bridge|पुल"],["How did the birds escape?|चिड़ियाँ कैसे बचीं?","They flew up together|सब साथ उड़ीं","They fought|वे लड़ीं","They slept|वे सो गईं","They cried|वे रोईं"],["Who cut the net?|जाल किसने काटा?","A mouse|चूहे ने","A cat|बिल्ली ने","A hunter|शिकारी ने","A crow|कौए ने"]]}];

{ic:"🐒",te:"The Monkey and the Crocodile",th:"बंदर और मगरमच्छ",en:"A monkey lived on a tree by a river and shared sweet fruits with a crocodile. One day the crocodile's wife wished to eat the monkey's heart. The crocodile carried the monkey on his back, but in the middle of the river he told the truth. The quick monkey said, 'My heart is hanging on the tree. Take me back to get it!' The crocodile did so, and the monkey jumped up the tree and was safe.",hi:"एक बंदर नदी किनारे पेड़ पर रहता था और मगरमच्छ को मीठे फल खिलाता था। एक दिन मगरमच्छ की पत्नी ने बंदर का दिल खाने की ज़िद की। मगरमच्छ बंदर को पीठ पर बैठाकर चला, पर नदी के बीच में उसने सच बता दिया। चतुर बंदर बोला, 'मेरा दिल तो पेड़ पर टँगा है। मुझे वापस ले चलो, मैं ले आता हूँ!' मगरमच्छ उसे वापस ले गया, और बंदर उछलकर पेड़ पर चढ़ गया और बच गया।",me:"Stay calm and think quickly in danger.",mh:"मुसीबत में शांत रहो और जल्दी सोचो।",q:[["What did the monkey share with the crocodile?|बंदर ने मगरमच्छ के साथ क्या बाँटा?","Sweet fruits|मीठे फल","Fish|मछली","Nuts|मेवे","Water|पानी"],["Where did the monkey say his heart was?|बंदर ने कहा कि उसका दिल कहाँ है?","On the tree|पेड़ पर","In the river|नदी में","At home|घर में","In a box|डिब्बे में"],["How did the monkey save himself?|बंदर ने खुद को कैसे बचाया?","By thinking quickly|जल्दी सोचकर","By fighting|लड़कर","By crying|रोकर","By swimming away|तैरकर भागकर"]]},
{ic:"🥚",te:"The Golden Egg",th:"सोने का अंडा",en:"A farmer had a hen that laid one golden egg every day. He sold the eggs and slowly became rich. But he became greedy and thought, 'If I cut the hen open, I will get all the gold at once.' He cut the hen, but found nothing inside. Now he had no hen and no more golden eggs.",hi:"एक किसान के पास एक मुर्गी थी जो रोज़ एक सोने का अंडा देती थी। अंडे बेचकर किसान धीरे-धीरे अमीर होने लगा। फिर उसे लालच आया और उसने सोचा, 'मुर्गी को काट दूँ तो सारा सोना एक साथ मिल जाएगा।' उसने मुर्गी को काटा, पर अंदर कुछ नहीं निकला। अब न मुर्गी बची, न सोने के अंडे।",me:"Greed spoils everything.",mh:"लालच बुरी बला है।",q:[["What did the hen lay every day?|मुर्गी रोज़ क्या देती थी?","A golden egg|सोने का अंडा","A silver coin|चाँदी का सिक्का","A white egg|सफ़ेद अंडा","A diamond|हीरा"],["Why did the farmer cut the hen?|किसान ने मुर्गी को क्यों काटा?","He became greedy|उसे लालच आ गया","He was hungry|उसे भूख लगी थी","He was angry|उसे गुस्सा आया","By mistake|गलती से"],["What did the farmer find inside?|किसान को अंदर क्या मिला?","Nothing|कुछ नहीं","Gold|सोना","Eggs|अंडे","A key|चाबी"]]},
{ic:"🐺",te:"The Boy Who Cried Wolf",th:"भेड़िया आया!",en:"A shepherd boy looked after sheep near a village. For fun he shouted, 'Wolf! Wolf!' and the villagers ran to help, but there was no wolf. He laughed and did it again. One day a real wolf came, and he shouted for help, but nobody believed him. The wolf scattered the sheep.",hi:"एक चरवाहा लड़का गाँव के पास भेड़ें चराता था। मज़ाक में वह चिल्लाया, 'भेड़िया! भेड़िया!' गाँव वाले मदद को दौड़े, पर कोई भेड़िया नहीं था। वह हँसा और उसने फिर यही किया। एक दिन सच में भेड़िया आ गया। उसने मदद माँगी, पर किसी ने उसका विश्वास नहीं किया, और भेड़िये ने भेड़ें बिखेर दीं।",me:"A liar is not believed even when he tells the truth.",mh:"झूठ बोलने वाले की सच बात पर भी कोई भरोसा नहीं करता।",q:[["What was the boy's job?|लड़के का काम क्या था?","Looking after sheep|भेड़ें चराना","Selling milk|दूध बेचना","Teaching|पढ़ाना","Fishing|मछली पकड़ना"],["Why did the villagers not help the last time?|आख़िरी बार गाँव वाले मदद को क्यों नहीं आए?","They did not believe him|उन्होंने उसका विश्वास नहीं किया","They were asleep|वे सो रहे थे","They were afraid|वे डर गए","They were away|वे बाहर गए थे"],["What does the story teach?|कहानी क्या सिखाती है?","Always tell the truth|हमेशा सच बोलो","Play tricks|मज़ाक करते रहो","Run fast|तेज़ दौड़ो","Sleep early|जल्दी सोओ"]]},
{ic:"🐜",te:"The Ant and the Grasshopper",th:"चींटी और टिड्डा",en:"In summer, a grasshopper sang and played all day. A little ant worked hard and kept grains for winter. The grasshopper laughed at her. When winter came, the grasshopper was hungry and cold, and the ant shared some food with him. He promised to work hard next time.",hi:"गर्मियों में एक टिड्डा दिन भर गाता और खेलता रहता था। एक छोटी चींटी मेहनत करके सर्दियों के लिए अनाज जमा करती रही। टिड्डा उस पर हँसा। जब सर्दी आई तो टिड्डा भूखा और ठंड से परेशान था। चींटी ने उसे थोड़ा खाना दिया, और टिड्डे ने वादा किया कि अगली बार वह भी मेहनत करेगा।",me:"Work hard today to be safe tomorrow.",mh:"आज मेहनत करो, कल सुरक्षित रहोगे।",q:[["What did the ant collect?|चींटी ने क्या जमा किया?","Grains|अनाज","Flowers|फूल","Stones|पत्थर","Leaves|पत्ते"],["What did the grasshopper do all summer?|टिड्डा पूरी गर्मी क्या करता रहा?","Sang and played|गाता और खेलता रहा","Worked hard|मेहनत करता रहा","Slept|सोता रहा","Travelled|घूमता रहा"],["How did the ant help the grasshopper?|चींटी ने टिड्डे की कैसे मदद की?","She shared food|उसने खाना बाँटा","She gave a house|उसने घर दिया","She sang a song|उसने गाना गाया","She ran away|वह भाग गई"]]},
{ic:"🐰",te:"The Clever Rabbit and the Lion",th:"चतुर खरगोश और शेर",en:"A fierce lion ate the animals of the forest every day. The animals asked him to take only one animal a day, so he would not hunt everyone. One day it was the turn of a small rabbit. The clever rabbit reached late and said, 'Another lion in a well wants your place!' The angry lion looked into the well, saw his own shadow, and jumped in. The forest was safe again.",hi:"एक खूँखार शेर रोज़ जंगल के जानवरों को खा जाता था। जानवरों ने कहा कि वे रोज़ एक जानवर खुद भेज देंगे, ताकि वह सबका शिकार न करे। एक दिन एक छोटे खरगोश की बारी आई। चतुर खरगोश देर से पहुँचा और बोला, 'कुएँ में एक और शेर है, जो तुम्हारी जगह लेना चाहता है!' गुस्से में शेर ने कुएँ में झाँका, अपनी परछाईं देखी और कूद पड़ा। जंगल फिर सुरक्षित हो गया।",me:"Brains are stronger than strength.",mh:"बुद्धि ताकत से बड़ी होती है।",q:[["Whose turn was it that day?|उस दिन किसकी बारी थी?","A small rabbit|एक छोटे खरगोश की","A deer|एक हिरन की","A monkey|एक बंदर की","An elephant|एक हाथी की"],["What did the lion see in the well?|शेर ने कुएँ में क्या देखा?","His own shadow|अपनी परछाईं","A real lion|एक असली शेर","A fish|एक मछली","Gold|सोना"],["Who saved the forest?|जंगल को किसने बचाया?","The clever rabbit|चतुर खरगोश ने","The hunter|शिकारी ने","The farmer|किसान ने","The fox|लोमड़ी ने"]]}

function speakStory(x){try{speechSynthesis.cancel();const ps=[];if(L()!=="hi")ps.push([x.en,"en-IN"]);if(L()!=="en")ps.push([x.hi,"hi-IN"]);ps.forEach(q=>{const u=new SpeechSynthesisUtterance(q[0]);u.lang=q[1];u.rate=.9;speechSynthesis.speak(u)})}catch(e){}}
function storiesInit(){head("stories","📖 "+B("Stories","कहानियाँ"));
 $("b_stories").innerHTML="<p>"+B("Pick a story. Read it, listen to it, then answer the questions.","एक कहानी चुनो। पढ़ो, सुनो और फिर सवालों के जवाब दो।")+"</p><div class='hcards'>"+STORIES.map((x,i)=>"<button class='hc' data-i='"+i+"'><i class='ic'>"+x.ic+"</i><b>"+B(x.te,x.th)+"</b><span>"+B("Moral: ","सीख: ")+B(x.me,x.mh)+"</span><em>▶ "+B("Read","पढ़ो")+"</em></button>").join("")+"</div>";
 $("b_stories").querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>storyOpen(+b.dataset.i))}
function storyOpen(i){const x=STORIES[i],tx=L()==="hi"?"<p>"+x.hi+"</p>":L()==="en"?"<p>"+x.en+"</p>":"<p>"+x.en+"</p><p>"+x.hi+"</p>";
 $("b_stories").innerHTML="<button id='sbk'>← "+B("Stories","कहानियाँ")+"</button><h2>"+x.ic+" "+B(x.te,x.th)+"</h2><div class='story'>"+tx+"</div><p class='tipb'>💡 "+B("Moral: "+x.me,"सीख: "+x.mh)+"</p><div class='bar'><button id='sls'>🔊 "+B("Read aloud","सुनाओ")+"</button><button id='sst'>⏹</button><button id='sq'>📝 "+B("Quiz","क्विज़")+"</button></div><div id='stbox'></div>";
 $("sbk").onclick=storiesInit;$("sls").onclick=()=>speakStory(x);$("sst").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}};
 $("sq").onclick=()=>{try{speechSynthesis.cancel()}catch(e){}play("stbox",x.q.map(q=>gkItem({q:q,i:x.ic})),()=>storyOpen(i))}}

const SJL={Math:"गणित",Hindi:"हिंदी",English:"अंग्रेज़ी",GK:"सामान्य ज्ञान",Science:"विज्ञान"};
const eh=t=>String(t==null?"":t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const subjLabel=x=>SJL[x]?B(x,SJL[x]):eh(x);
const wkey=q=>q.h+"|"+String(q.p).slice(0,40);
const AUD={},QSP={};
let cmsTop="Math",bankSub="",bankTopic="",bankDiff="";
const CMS={list:[],mode:"local",admin:true,ready:false,db:null};
const canAdmin=()=>isAdminUser();
const validQ=c=>!!(c&&c.q&&Array.isArray(c.o)&&c.o.length>=2&&Number.isInteger(c.c)&&c.c>=0&&c.c<c.o.length);
const cmsActive=()=>CMS.list.filter(c=>c.active!==false&&validQ(c));
function cmsLocalLoad(){try{CMS.list=JSON.parse(localStorage.getItem("gg_cms")||"[]")}catch(e){CMS.list=[]}}
function cmsLocalSave(){try{localStorage.setItem("gg_cms",JSON.stringify(CMS.list))}catch(e){toast("⚠️ "+B("Storage is full","जगह भर गई है"))}}
async function cmsInit(){
 try{const db=window.claude&&window.claude.use?await window.claude.use("db"):null;
  if(db){CMS.db=db;let u=null;try{u=await window.claude.use("user")}catch(e){}
   CMS.admin=u?await u.canEdit():false;CMS.mode="db";
   db.collection("cms_q").limit(1000).onSnapshot(sn=>{CMS.list=sn.docs.map(d=>Object.assign({id:d.id},d.data()));CMS.ready=true;if(LOGGED){navBuild(page);if(page==="admin")adminList();if(page==="bank")bankInit()}},e=>{CMS.mode="local";cmsLocalLoad()});return}
 }catch(e){}
 CMS.mode="local";cmsLocalLoad();CMS.ready=true}
async function cmsPut(q){q.ts=Date.now();
 if(CMS.mode==="db"){const d=Object.assign({},q);delete d.id;await CMS.db.collection("cms_q").doc(q.id).set(d)}
 else{const i=CMS.list.findIndex(x=>x.id===q.id);if(i>=0)CMS.list[i]=q;else CMS.list.push(q);cmsLocalSave()}}
async function cmsDel(id){if(CMS.mode==="db")await CMS.db.collection("cms_q").doc(id).delete();else{CMS.list=CMS.list.filter(x=>x.id!==id);cmsLocalSave()}}
